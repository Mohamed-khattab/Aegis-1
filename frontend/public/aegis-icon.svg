<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shield-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Shield shape -->
  <path d="M50 5 L90 20 L90 45 C90 70 70 90 50 95 C30 90 10 70 10 45 L10 20 Z" 
        fill="url(#shield-gradient)" 
        stroke="#075985" 
        stroke-width="2"/>
  <!-- Inner shield detail -->
  <path d="M50 15 L80 27 L80 45 C80 65 65 80 50 85 C35 80 20 65 20 45 L20 27 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1.5"
        opacity="0.3"/>
  <!-- A1 text -->
  <text x="50" y="58" 
        text-anchor="middle" 
        font-family="Arial, sans-serif" 
        font-size="28" 
        font-weight="bold" 
        fill="#ffffff">A1</text>
  <!-- Circuit lines decoration -->
  <circle cx="30" cy="40" r="3" fill="#22c55e"/>
  <circle cx="70" cy="40" r="3" fill="#22c55e"/>
  <line x1="30" y1="40" x2="40" y2="50" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="60" y2="50" stroke="#22c55e" stroke-width="1.5"/>
</svg>
